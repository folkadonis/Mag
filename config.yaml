# Mag — Daily AI News Digest configuration
# Every feed, weight, and threshold used by the pipeline lives here so that
# tuning the digest never requires touching code.

scoring:
  recency_half_life_hours: 24   # recency_decay = 0.5 at this age
  dedupe_jaccard_threshold: 0.5

topics:
  # Substring match (case-insensitive) against title + summary.
  # Items whose type is "paper" are exempt from this filter entirely.
  keywords:
    - "ai"
    - "artificial intelligence"
    - "llm"
    - "large language model"
    - "language model"
    - "transformer"
    - "gpt"
    - "claude"
    - "gemini"
    - "anthropic"
    - "openai"
    - "deepmind"
    - "diffusion model"
    - "reinforcement learning"
    - "fine-tun"
    - "finetun"
    - "inference"
    - "agent"
    - "benchmark"
    - "dataset"
    - "neural network"
    - "machine learning"
    - "deep learning"
    - "rag"
    - "retrieval augmented"
    - "multimodal"
    - "vision-language"
    - "alignment"
    - "ai safety"
    - "open source model"
    - "open-weight"
    - "quantiz"
    - "pretrain"
    - "embedding"
    - "chatbot"
    - "generative"
    - "hugging face"
    - "mixture of experts"
    - "moe"
    # Security / hacker-news signal (for The Hacker News, Krebs on Security)
    - "vulnerability"
    - "exploit"
    - "cve-"
    - "zero-day"
    - "ransomware"
    - "malware"
    - "cybersecurity"
    - "data breach"
    - "phishing"
    - "supply chain attack"
    - "hacked"
    - "security flaw"
    - "patch"
    # General tech-industry / engineering-blog signal (for Uber, Netflix,
    # Amazon, X, and other company engineering blogs)
    - "engineering blog"
    - "infrastructure"
    - "distributed system"
    - "scalability"
    - "kubernetes"
    - "cloud native"
    - "platform engineering"
    - "system design"
    - "open source"
    - "microservice"
    - "outage"
    - "incident report"
    - "api"
    # Local / edge / self-hosted model inference
    - "self-host"
    - "self hosted"
    - "on-device"
    - "edge inference"
    - "local inference"
    - "local llm"
    - "ollama"
    - "llama.cpp"
    - "gguf"
    - "raspberry pi"
    - "mobile inference"
    - "home server"
    - "apple silicon"
    - "mlx"
    - "model release"
    - "open weights"

sources:
  # Global recency window for RSS feeds. Several publishers (OpenAI,
  # Hugging Face) serve their entire archive back to 2015 in a single feed,
  # so without this the ranker drowns in years-old posts. Individual feeds
  # may override with their own `lookback_hours` / `max_items`.
  #
  # A week is deliberately generous: most corporate engineering blogs
  # publish weekly, not daily, so a 48h window drops the labs entirely.
  # The `seen` store below is what stops a week-old story from being
  # republished every morning.
  lookback_hours: 168

  rss:
    # --- AI labs ---
    # Anthropic and xAI publish no RSS feed of their own (every documented
    # path 404s as of 2026-08), so they are covered through targeted Google
    # News queries instead.
    - name: "Anthropic (via news)"
      url: "https://news.google.com/rss/search?q=Anthropic+OR+%22Claude+AI%22+when:2d&hl=en-US&gl=US&ceid=US:en"
      weight: 1.4
      type: "blog"
      max_items: 15
    - name: "xAI / Grok (via news)"
      url: "https://news.google.com/rss/search?q=%22xAI%22+OR+Grok+when:2d&hl=en-US&gl=US&ceid=US:en"
      weight: 1.0
      type: "blog"
      max_items: 10
    - name: "OpenAI"
      url: "https://openai.com/news/rss.xml"
      weight: 1.4
      type: "blog"
    - name: "Google DeepMind"
      url: "https://deepmind.google/blog/rss.xml"
      weight: 1.4
      type: "blog"
    - name: "Google Research"
      url: "https://research.google/blog/rss/"
      weight: 1.3
      type: "blog"
    - name: "Meta Engineering & AI"
      url: "https://engineering.fb.com/feed/"
      weight: 1.2
      type: "blog"
    - name: "Mistral AI"
      url: "https://mistral.ai/news/rss"
      weight: 1.2
      type: "blog"
    - name: "NVIDIA AI"
      url: "https://blogs.nvidia.com/feed/"
      weight: 1.1
      type: "blog"
    - name: "Microsoft Research"
      url: "https://www.microsoft.com/en-us/research/feed/"
      weight: 1.1
      type: "blog"
    - name: "Hugging Face"
      url: "https://huggingface.co/blog/feed.xml"
      weight: 1.1
      type: "blog"
    - name: "Simon Willison"
      url: "https://simonwillison.net/atom/everything/"
      weight: 1.3
      type: "blog"
    - name: "TechCrunch AI"
      url: "https://techcrunch.com/category/artificial-intelligence/feed/"
      weight: 0.8
      type: "blog"

    # --- Big-tech engineering blogs ---
    # Uber and X Engineering block automated feed access (406/403) and were
    # dropped; Cloudflare, GitHub and Airbnb replace them.
    - name: "Netflix Tech Blog"
      url: "https://netflixtechblog.com/feed"
      weight: 0.9
      type: "blog"
    - name: "AWS Machine Learning"
      url: "https://aws.amazon.com/blogs/machine-learning/feed/"
      weight: 1.0
      type: "blog"
    - name: "Cloudflare Blog"
      url: "https://blog.cloudflare.com/rss/"
      weight: 0.9
      type: "blog"
    - name: "GitHub Engineering"
      url: "https://github.blog/engineering/feed/"
      weight: 0.9
      type: "blog"
    # --- Security / hacker news ---
    - name: "The Hacker News"
      url: "https://feeds.feedburner.com/TheHackersNews"
      weight: 0.9
      type: "blog"
      max_items: 20
    - name: "Krebs on Security"
      url: "https://krebsonsecurity.com/feed/"
      weight: 0.9
      type: "blog"

    # --- Local / self-hosted inference ---
    - name: "Ollama Releases"
      url: "https://github.com/ollama/ollama/releases.atom"
      weight: 0.9
      type: "blog"
      max_items: 5
    - name: "llama.cpp Releases"
      url: "https://github.com/ggml-org/llama.cpp/releases.atom"
      weight: 0.7
      type: "blog"
      max_items: 3
    - name: "vLLM Releases"
      url: "https://github.com/vllm-project/vllm/releases.atom"
      weight: 0.8
      type: "blog"
      max_items: 3
    - name: "r/LocalLLaMA"
      url: "https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day"
      weight: 0.9
      type: "blog"
      max_items: 15

  arxiv:
    base_url: "http://export.arxiv.org/api/query"
    categories: ["cs.CL", "cs.AI", "cs.LG"]
    max_results: 60
    # arXiv does not publish at weekends, so a 30h window returns nothing at
    # all on Mondays. 96h spans the gap.
    lookback_hours: 96
    timeout_seconds: 60   # arXiv is slow and frequently times out at 20s
    weight: 1.0
    type: "paper"

  hn:
    base_url: "https://hn.algolia.com/api/v1/search_by_date"
    min_points: 80
    lookback_hours: 36
    weight: 1.2
    type: "hn"

  hf_daily_papers:
    base_url: "https://huggingface.co/api/daily_papers"
    weight: 1.15
    type: "paper"

# Cross-run memory, so a story published in Monday's issue does not come
# back on Tuesday. Stored in archive/seen.json (committed by CI so the
# memory survives between scheduled runs).
seen:
  enabled: true
  retention_days: 30

editor:
  # backend: how the editorial pass reaches Claude.
  #   auto — use the Claude Code CLI if it is installed (Pro/Max
  #          subscription auth, no API key needed), else fall back to
  #          ANTHROPIC_API_KEY.
  #   cli  — force the subscription CLI.
  #   api  — force the metered API; requires ANTHROPIC_API_KEY.
  backend: "auto"
  model: "sonnet"               # CLI alias; resolves to the latest Sonnet
  api_model: "claude-sonnet-5"  # used only by the `api` backend
  max_tokens: 16000             # the plain-language format is verbose
  max_stories_considered: 60
  cli_timeout_seconds: 300

email:
  subject_prefix: "Mag — Daily AI Digest"
  from_name: "Mag"
