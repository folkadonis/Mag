name: Daily AI Digest

on:
  schedule:
    # 01:00 UTC daily. GitHub's scheduler is best-effort and often runs
    # 5-20 minutes late under load; that is normal and harmless here.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and archive the digest without sending email"
        type: boolean
        default: false
      no_llm:
        description: "Skip the Claude editor call and publish the raw feed digest"
        type: boolean
        default: false
      ignore_seen:
        description: "Allow stories that were already published in an earlier issue"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mag-daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests
        run: python -m pytest tests/smoke_test.py -v

      - name: Build and send digest
        env:
          # editor.backend is "api" in config.yaml, so only this is needed
          # (console.anthropic.com), billed per-use — no CLI, no subscription.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.no_llm }}" = "true" ]; then ARGS="$ARGS --no-llm"; fi
          if [ "${{ inputs.ignore_seen }}" = "true" ]; then ARGS="$ARGS --ignore-seen"; fi
          python -m src.main $ARGS

      - name: Commit archived digest
        id: archive
        # archive/seen.json is what stops tomorrow's issue from repeating
        # today's stories, so it must be committed alongside the HTML.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/
          if git diff --cached --quiet; then
            echo "No archive changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Archive digest for $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel
        # Vercel's GitHub webhook integration on this project isn't firing
        # auto-deploys on push (unconfirmed why), so trigger the deploy
        # directly instead of depending on it. Needs a VERCEL_TOKEN repo
        # secret (vercel.com -> Account Settings -> Tokens); the team and
        # project ids below aren't secret, just identifiers.
        if: steps.archive.outputs.committed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set; skipping Vercel deploy (Vercel's own git integration may or may not pick this up on its own)."
            exit 0
          fi
          curl -sS -X POST \
            "https://api.vercel.com/v13/deployments?teamId=team_NubkLpGQJOVRMIqLPDE6BKov" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "mag",
              "project": "prj_4xwGCjiVWQu8GWgJnTENaJBgQTEy",
              "target": "production",
              "gitSource": {
                "type": "github",
                "org": "folkadonis",
                "repo": "Mag",
                "ref": "claude/mag-ai-news-digest-mnqkge"
              }
            }' | tee /tmp/vercel_deploy.json
          echo
          python3 -c "
          import json
          d = json.load(open('/tmp/vercel_deploy.json'))
          if 'error' in d:
              raise SystemExit(f\"Vercel deploy failed: {d['error']}\")
          print(f\"Vercel deployment queued: {d.get('id')} -> {d.get('url')}\")
          "
