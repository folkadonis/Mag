name: Daily AI Digest

on:
  schedule:
    # 01:00 UTC daily. GitHub's scheduler is best-effort and often runs
    # 5-20 minutes late under load; that is normal and harmless here.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and archive the digest without sending email"
        type: boolean
        default: false
      no_llm:
        description: "Skip the Claude editor call and publish the raw feed digest"
        type: boolean
        default: false
      ignore_seen:
        description: "Allow stories that were already published in an earlier issue"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mag-daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        # The editorial pass runs through the Claude Code CLI so it bills
        # against a Claude Pro/Max subscription instead of the metered API.
        run: npm install -g @anthropic-ai/claude-code

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests
        run: python -m pytest tests/smoke_test.py -v

      - name: Build and send digest
        env:
          # Mint with `claude setup-token` on a machine where you are logged
          # in, then store the value as a repository secret. Works with a
          # Pro subscription; no ANTHROPIC_API_KEY required.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.no_llm }}" = "true" ]; then ARGS="$ARGS --no-llm"; fi
          if [ "${{ inputs.ignore_seen }}" = "true" ]; then ARGS="$ARGS --ignore-seen"; fi
          python -m src.main $ARGS

      - name: Commit archived digest
        # archive/seen.json is what stops tomorrow's issue from repeating
        # today's stories, so it must be committed alongside the HTML.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/
          if git diff --cached --quiet; then
            echo "No archive changes to commit"
          else
            git commit -m "Archive digest for $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
